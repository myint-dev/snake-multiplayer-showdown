openapi: 3.1.0
info:
  title: Snake Multiplayer Showdown API
  version: 1.0.0
  description: |
    REST representation of the BackendService contract used by frontend/src/services.
    The frontend currently uses an in-browser mock, so it does not prescribe URL
    strings; the paths in this document are the backend contract to implement.
servers:
  - url: /api
paths:
  /auth/signup:
    post:
      operationId: signUp
      summary: Register a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Registered session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /auth/login:
    post:
      operationId: signIn
      summary: Sign in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/logout:
    post:
      operationId: signOut
      summary: End the current session
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /auth/me:
    get:
      operationId: getSession
      summary: Get the current authenticated user and session token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /leaderboard:
    get:
      operationId: leaderboard
      summary: Get the highest score per player for a mode
      parameters:
        - { $ref: '#/components/parameters/GameMode' }
        - name: limit
          in: query
          required: false
          description: Maximum entries to return. Defaults to 10.
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        '200':
          description: Entries sorted by score descending, then creation time ascending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScoreEntry' }
    post:
      operationId: submitScore
      summary: Submit a score for the authenticated player
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitScoreRequest' }
      responses:
        '201':
          description: Submitted score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreEntry' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /leaderboard/personal-best:
    get:
      operationId: personalBest
      summary: Get the current player's best score for a mode
      description: Authentication is optional. An anonymous caller receives `0`.
      parameters:
        - { $ref: '#/components/parameters/GameMode' }
      responses:
        '200':
          description: Best score (zero if the caller is anonymous or has no score)
          content:
            application/json:
              schema: { type: integer, minimum: 0 }
  /games:
    post:
      operationId: startGame
      summary: Start broadcasting a live game
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartGameRequest' }
      responses:
        '201':
          description: Active game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveGame' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /games/active:
    get:
      operationId: listActiveGames
      summary: List active games available for spectating
      responses:
        '200':
          description: Active games, sorted by score descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActiveGame' }
  /games/{gameId}:
    get:
      operationId: getGame
      summary: Get an active game snapshot
      parameters:
        - { $ref: '#/components/parameters/GameId' }
      responses:
        '200':
          description: Active game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveGame' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /games/{gameId}/snapshot:
    put:
      operationId: publishGameSnapshot
      summary: Publish the latest snapshot of a live game
      description: |
        The frontend mock does not require authentication for this operation and
        silently succeeds if the game does not exist. A production backend should
        normally require the owning player's bearer token.
      parameters:
        - { $ref: '#/components/parameters/GameId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameSnapshot' }
      responses:
        '204': { description: Snapshot published (or game already absent) }
  /games/{gameId}/finish:
    post:
      operationId: finishGame
      summary: Mark a game over and remove it from the active list
      description: |
        The frontend mock does not require authentication for this operation and
        silently succeeds if the game does not exist. A production backend should
        normally require the owning player's bearer token.
      parameters:
        - { $ref: '#/components/parameters/GameId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 0 }
              additionalProperties: false
      responses:
        '204': { description: Game finished (or game already absent) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string }
    GameMode:
      name: mode
      in: query
      required: true
      schema: { $ref: '#/components/schemas/GameMode' }
  responses:
    ValidationError:
      description: Invalid request data
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ConflictError:
      description: Username is already taken
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnauthorizedError:
      description: Missing, invalid, or expired session token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFoundError:
      description: Game does not exist or is no longer active
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 6, format: password }
      additionalProperties: false
    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        createdAt: { type: integer, format: int64, description: Unix time in milliseconds }
    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    GameMode:
      type: string
      enum: [walls, pass-through]
    Direction:
      type: string
      enum: [up, down, left, right]
    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: integer }
        y: { type: integer }
      additionalProperties: false
    GameSnapshot:
      type: object
      required: [grid, snake, food, dir, score, status]
      properties:
        grid: { type: integer, minimum: 1 }
        snake:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Point' }
        food: { $ref: '#/components/schemas/Point' }
        dir: { $ref: '#/components/schemas/Direction' }
        score: { type: integer, minimum: 0 }
        status: { type: string, enum: [running, over] }
      additionalProperties: false
    StartGameRequest:
      type: object
      required: [mode, snapshot]
      properties:
        mode: { $ref: '#/components/schemas/GameMode' }
        snapshot: { $ref: '#/components/schemas/GameSnapshot' }
      additionalProperties: false
    ActiveGame:
      type: object
      required: [id, userId, username, mode, score, startedAt, isBot, snapshot]
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        mode: { $ref: '#/components/schemas/GameMode' }
        score: { type: integer, minimum: 0 }
        startedAt: { type: integer, format: int64, description: Unix time in milliseconds }
        isBot: { type: boolean }
        snapshot: { $ref: '#/components/schemas/GameSnapshot' }
    SubmitScoreRequest:
      type: object
      required: [mode, score]
      properties:
        mode: { $ref: '#/components/schemas/GameMode' }
        score: { type: integer, minimum: 0 }
      additionalProperties: false
    ScoreEntry:
      type: object
      required: [id, userId, username, mode, score, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        mode: { $ref: '#/components/schemas/GameMode' }
        score: { type: integer, minimum: 0 }
        createdAt: { type: integer, format: int64, description: Unix time in milliseconds }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
